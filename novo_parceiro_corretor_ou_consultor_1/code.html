<!DOCTYPE html>
<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Novo Parceiro - Cadastro</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0b4126",
                        "accent-red": "#E60023",
                        "glass-surface": "rgba(255, 255, 255, 0.03)",
                        "glass-border": "rgba(255, 255, 255, 0.08)",
                        "background-light": "#f2f2f2",
                        "background-dark": "#14141f",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "sans": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem", 
                        "lg": "1rem", 
                        "xl": "1.5rem", 
                        "full": "9999px"
                    },
                    backgroundImage: {
                        'glass-gradient': 'linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 100%)',
                    }
                },
            },
        }
    </script>
<style>::-webkit-scrollbar {
    width: 6px
    }
::-webkit-scrollbar-track {
    background: #14141f
    }
::-webkit-scrollbar-thumb {
    background: #2a2a35;
    border-radius: 3px
    }.glass-panel {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 4px 24px -1px rgba(0, 0, 0, 0.2)
    }
.glass-input {
    background: rgba(20, 20, 31, 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease
    }
.glass-input:focus-within {
    border-color: rgba(255, 255, 255, 0.3);
    background: rgba(20, 20, 31, 0.8);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05)
    }.peer-checked-bg-red:checked ~ .bg-red-selector {
    background-color: #E60023;
    color: white;
    border-color: #E60023
    }
.peer-checked-text-white:checked + span {
    color: white;
    font-weight: 600
    }.bg-noise {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
    opacity: 0.03;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDLaGvIx1h-NM6zZJPkiE47pcer3p949AVYhc4kMuPIQ0FM4h3NFB3To7UtucaUqUs1Ip3NL-VxSPCwIOk8xVKKbW2YoAczOpActaWnMDQrG-pAKx-7xkcQUe8QTEieIShNSicy4Emu1uN55je-24-HqP8h_LMJkw4tMPPwdOTwAAZGJyG8fXAZiFiM0e1hL75IPMZR0pVajuUajkzm5j1kklpxpWKGLpWaAfHW4dEj0LYAU4ymGU5saf8m1w8asDlUVP9SlDtZUv6z)
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-display min-h-screen flex flex-col antialiased selection:bg-accent-red selection:text-white">
<div class="bg-noise"></div>
<header class="sticky top-0 z-40 w-full backdrop-blur-xl bg-background-dark/80 border-b border-white/5 pt-safe-top">
<div class="flex items-center justify-between px-6 py-4">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full text-white/70 hover:bg-white/10 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[28px]">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-white">Novo Parceiro</h1>
<button class="text-sm font-medium text-white/50 hover:text-white transition-colors">
                Cancelar
            </button>
</div>
</header>
<main class="flex-1 w-full max-w-md mx-auto px-6 pt-6 pb-24 relative z-10">
<div class="mb-8">
<div class="relative flex p-1 rounded-xl bg-[#1f1f2e] border border-white/5 shadow-inner">
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="partner_type" type="radio" value="incorporadora"/>
<div class="absolute inset-0 rounded-lg transition-all duration-300 ease-out opacity-0 peer-checked:opacity-100 bg-accent-red shadow-lg shadow-red-900/40"></div>
<span class="relative block py-3 text-center text-xs font-medium text-white/50 transition-colors duration-300 peer-checked:text-white z-10 uppercase tracking-wide truncate">Incorporadora</span>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="partner_type" type="radio" value="corretor"/>
<div class="absolute inset-0 rounded-lg transition-all duration-300 ease-out opacity-0 peer-checked:opacity-100 bg-accent-red shadow-lg shadow-red-900/40"></div>
<span class="relative block py-3 text-center text-xs font-medium text-white/50 transition-colors duration-300 peer-checked:text-white z-10 uppercase tracking-wide truncate">Corretor</span>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="partner_type" type="radio" value="consultor"/>
<div class="absolute inset-0 rounded-lg transition-all duration-300 ease-out opacity-0 peer-checked:opacity-100 bg-accent-red shadow-lg shadow-red-900/40"></div>
<span class="relative block py-3 text-center text-xs font-medium text-white/50 transition-colors duration-300 peer-checked:text-white z-10 uppercase tracking-wide truncate">Consultor</span>
</label>
</div>
<p class="mt-3 text-xs text-center text-white/40 font-light tracking-wide uppercase">Selecione o perfil de acesso</p>
</div>
<form class="space-y-5">
<div class="group">
<label class="block text-xs font-medium text-white/60 mb-2 ml-1 tracking-wide uppercase">Dados da Empresa</label>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">business_center</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Nome da Incorporadora" type="text"/>
</div>
</div>
<div class="group space-y-3">
<label class="block text-xs font-medium text-white/60 mb-2 ml-1 tracking-wide uppercase">Responsável</label>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Nome do Responsável" type="text"/>
</div>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Cargo" type="text"/>
</div>
</div>
<div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent my-2"></div>
<div class="group space-y-3">
<label class="block text-xs font-medium text-white/60 mb-2 ml-1 tracking-wide uppercase">Contato Corporativo</label>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="E-mail Corporativo" type="email"/>
</div>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">smartphone</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Celular / WhatsApp" type="tel"/>
</div>
</div>
<div class="group">
<label class="block text-xs font-medium text-white/60 mb-2 ml-1 tracking-wide uppercase">Localização</label>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative group-focus-within:border-white/40">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">location_on</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Cidade Sede" type="text"/>
<button class="pr-4 pl-2 text-accent-red text-xs font-bold uppercase tracking-wider hover:text-red-400" type="button">
                        GPS
                    </button>
</div>
</div>
<div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent my-2"></div>
<div class="group space-y-3">
<label class="block text-xs font-medium text-white/60 mb-2 ml-1 tracking-wide uppercase">Dados Bancários</label>
<div class="glass-input rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" placeholder="Banco" type="text"/>
</div>
<div class="relative flex p-1 rounded-xl bg-[#1f1f2e] border border-white/5 shadow-inner h-14">
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer sr-only" name="account_type" type="radio" value="corrente"/>
<div class="absolute inset-0 rounded-lg transition-all duration-300 ease-out opacity-0 peer-checked:opacity-100 bg-accent-red shadow-lg shadow-red-900/40"></div>
<span class="relative flex items-center justify-center w-full h-full text-xs font-medium text-white/50 transition-colors duration-300 peer-checked:text-white z-10 uppercase tracking-wide">Corrente</span>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="account_type" type="radio" value="poupanca"/>
<div class="absolute inset-0 rounded-lg transition-all duration-300 ease-out opacity-0 peer-checked:opacity-100 bg-accent-red shadow-lg shadow-red-900/40"></div>
<span class="relative flex items-center justify-center w-full h-full text-xs font-medium text-white/50 transition-colors duration-300 peer-checked:text-white z-10 uppercase tracking-wide">Poupança</span>
</label>
</div>
<div class="flex gap-3">
<div class="glass-input flex-1 rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">confirmation_number</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" inputmode="numeric" placeholder="Agência" type="text"/>
</div>
<div class="glass-input flex-[1.5] rounded-xl flex items-center overflow-hidden h-14 relative">
<div class="pl-4 pr-3 text-white/30">
<span class="material-symbols-outlined text-[20px]">credit_card</span>
</div>
<input class="w-full bg-transparent border-none text-white placeholder-white/20 focus:ring-0 text-base h-full py-0 pl-0" inputmode="numeric" placeholder="Número da Conta" type="text"/>
</div>
</div>
</div>
</form>
</main>
<div class="fixed bottom-0 left-0 w-full z-30 p-6 pt-4 bg-gradient-to-t from-[#14141f] via-[#14141f] to-transparent">
<button class="relative w-full group overflow-hidden rounded-xl bg-accent-red p-4 shadow-[0_0_40px_-10px_rgba(230,0,35,0.5)] transition-all duration-300 hover:shadow-[0_0_60px_-15px_rgba(230,0,35,0.6)] hover:scale-[1.02] active:scale-[0.98]">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
<span class="relative flex items-center justify-center gap-2 text-white font-bold tracking-widest text-sm uppercase">
                Cadastrar Parceiro
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</span>
</button>
</div>
</body></html>
